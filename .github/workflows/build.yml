name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          GRADLEW=$(find . -name gradlew -not -path "./.git/*" | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found. Files in the repository:"
            find . -not -path "./.git/*" -type f | head -n 100
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: fence-shelves-jar
          path: |
            out/*.jar
            !out/*-sources.jar